        // =========================================================================
        // ZERO-ASSET WEB AUDIO ENGINE: SFX + dubstep music sequencer
        // =========================================================================
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.sfxOn = true;
                this.musicOn = false;
                this.musicVol = 0.6;
                this.sfxVol = 0.8;
                this.trackIdx = 0;
                this.timer = null;

                this.session = null;

                    this.ctx = ctx;

                    this.sfxBus = ctx.createGain();
                    this.musicBus.gain.value = this.musicVol * 0.9;
                    this.sfxBus.gain.value = this.sfxVol;
                    this.musicBus.connect(this.comp);
                    this.sfxBus.connect(this.comp);
                    this.comp.connect(this.master);
                    this.master.connect(ctx.destination);

                    const len = ctx.sampleRate;
                    const buf = ctx.createBuffer(1, len, ctx.sampleRate);

                    osc.frequency.setValueAtTime(freq, t);

                    osc.connect(gain);
                    gain.connect(this.sfxBus);
                    osc.start();
                    osc.stop(t + duration);

            // ---------- ARCADE SFX (scheduled on the audio clock) ----------

                if (!this._go()) return;
                const t = this.ctx.currentTime;
                this.hammerHit();

            combo(tier) {

                const t = this.ctx.currentTime;

            loadTrack(i) {
                this.trackIdx = i;
                this.track = TRACKS[i];
                this.step = 0;
                this.loops = 0;
                this.stepDur = 60 / this.track.bpm / 4;
                if (this.onTrack) this.onTrack(i);

            startMusic(idx) {
                this.init();
                if (!this.ctx) return;
                this.stopMusic(true);
                this.musicOn = true;
                this.loadTrack(idx == null ? this.trackIdx : idx);
                const c = this.ctx;
                this.session = c.createGain();
                this.session.gain.setValueAtTime(0.0001, c.currentTime);

            stopMusic(silent) {
                this.musicOn = false;
                if (this.timer) { clearInterval(this.timer); this.timer = null; }
                if (this.session && this.ctx) {

                    try {
                        s.gain.cancelScheduledValues(c.currentTime);
                        s.gain.setValueAtTime(s.gain.value, c.currentTime);
                        s.gain.linearRampToValueAtTime(0.0001, c.currentTime + 0.12);

            nextTrack() {
                const n = (this.trackIdx + 1) % TRACKS.length;
                if (this.musicOn) this.startMusic(n);

            pump() {
                if (!this.ctx || !this.musicOn) return;
                const c = this.ctx;
                if (this.nextTime < c.currentTime - 0.3) this.nextTime = c.currentTime + 0.05;
                while (this.nextTime < c.currentTime + 0.15) {
                    this.scheduleStep(this.step, this.nextTime);
                    this.nextTime += this.stepDur;
                    this.step++;
                    if (this.step >= this.track.total) {
                        this.step = 0;
                        this.loops++;
                        if (this.loops >= 2) this.loadTrack((this.trackIdx + 1) % TRACKS.length);
                    }

            scheduleStep(s, t) {
                const tr = this.track, sd = this.stepDur;
                const bar = Math.floor(s / 16), p = s % 16;
                // half-time dubstep drums
                if (p === 0 || (p === 10 && bar % 2 === 0) || (p === 14 && bar % 4 === 3)) this.kick(t);
                if (p === 8 || (p === 12 && bar % 4 === 3)) this.snare(t);
                if (p % 2 === 0) this.hat(t, p % 4 === 2 ? 0.2 : 0.11, 0.045);
                else if (bar % 2 === 1) this.hat(t, 0.05, 0.025);
                // wobble bass, two hits per bar
                if (p === 0 || p === 8) {
                    const root = tr.rootMidi[bar % tr.rootMidi.length];
                    const mult = tr.wob[(bar + (p === 8 ? 1 : 0)) % tr.wob.length];
                    this.wobble(t, sd * 7.6, root, mult);
                }
                // lead melody
                const ev = tr.events[s];
                if (ev) this.lead(t, ev.len * sd, ev.midi);
            }
            kick(t) {
                const c = this.ctx;
                const o = c.createOscillator(), g = c.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(160, t);
                o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
                g.gain.setValueAtTime(1.0, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
                o.connect(g); g.connect(this.session);
                o.start(t); o.stop(t + 0.4);
            }
            snare(t) {
                const c = this.ctx;
                const n = c.createBufferSource(); n.buffer = this.noiseBuf;
                const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
                const g = c.createGain();
                g.gain.setValueAtTime(0.55, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
                n.connect(hp); hp.connect(g); g.connect(this.session);
                n.start(t, Math.random() * 0.5); n.stop(t + 0.25);
                const o = c.createOscillator(), og = c.createGain();
                o.type = 'triangle';
                o.frequency.setValueAtTime(200, t);
                o.frequency.exponentialRampToValueAtTime(110, t + 0.1);
                og.gain.setValueAtTime(0.4, t);
                og.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
                o.connect(og); og.connect(this.session);
                o.start(t); o.stop(t + 0.18);
            }
            hat(t, vol, dur) {
                const c = this.ctx;
                const n = c.createBufferSource(); n.buffer = this.noiseBuf;
                const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500;
                const g = c.createGain();
                g.gain.setValueAtTime(vol, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                n.connect(hp); hp.connect(g); g.connect(this.session);
                n.start(t, Math.random() * 0.5); n.stop(t + dur + 0.02);
            }
            wobble(t, dur, midi, mult) {
                const c = this.ctx;
                const f = midiToFreq(midi);
                const o1 = c.createOscillator(), o2 = c.createOscillator(), sub = c.createOscillator();
                o1.type = 'sawtooth'; o2.type = 'sawtooth'; sub.type = 'sine';
                o1.frequency.value = f; o2.frequency.value = f * 1.006; sub.frequency.value = f;
                const flt = c.createBiquadFilter();
                flt.type = 'lowpass'; flt.Q.value = 10; flt.frequency.value = 450;
                const lfo = c.createOscillator(), lg = c.createGain();

                lfo.frequency.value = this.track.bpm / 60 * mult;
                lg.gain.value = 380;
                lfo.connect(lg); lg.connect(flt.frequency);
                const sh = c.createWaveShaper(); sh.curve = this.curve;
                const g = c.createGain();
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(0.3, t + 0.01);
                g.gain.setValueAtTime(0.3, t + dur - 0.03);

        const fmtTime = (sec) => { sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}` : `${m}:${String(x).padStart(2, '0')}`; };

        const checkValidMoves = (cols) => {

            const hammers = allCards.filter(c => c.type === 'hammer');
            if (hammers.length >= 2) return true;
            if (hammers.length >= 1 && allCards.some(c => c.type === 'molecule' || c.type === 'block')) return true;

            for (let i = 0; i < allCards.length; i++) {
                for (let j = i + 1; j < allCards.length; j++) {

                let { col, row, card, blast } = queue.shift();
                if (!card) continue;

                let key = `${col},${row}`;

                destroyed.add(key);

            };
            const skipTrack = () => { Snd.init(); Snd.nextTrack(); };
            const pickTrack = (i) => { Snd.init(); setBgmOn(true); Snd.startMusic(i); };
            const toggleSfx = () => {
                const next = !sfxOn;
                setSfxOn(next);
                Snd.sfxOn = next;
                if (next) { Snd.init(); Snd.select(); }
            };
            const cycleViewport = () => {
                const next = VIEWPORT_ORDER[(VIEWPORT_ORDER.indexOf(vp) + 1) % VIEWPORT_ORDER.length];
                setVp(next);
                addToast(`Viewport: ${VIEWPORTS[next].label} Mode`, "🖥️", "bg-cyan-700 text-white border-cyan-400");
            };
            const downloadGame = () => {
                try {
                    const html = buildStandaloneHtml();
                    const blob = new Blob([html], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'BioArcade-ResearchSimulator.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                    addToast(`Downloading standalone HTML game (${Math.round(blob.size / 1024)} KB)...`, "📥", "bg-cyan-700 text-white border-cyan-400");
                } catch (e) {
                    addToast("Download blocked in this view. Open the game in its own tab and try again.", "⚠️", "bg-red-600 text-white border-red-400");
                }
            };

            // ---- board sizing: fit the 8x10 grid inside whatever space is left ----
            useEffect(() => {
                const el = boardWrapRef.current;
                if (!el) return;
                const calc = () => {
                    const r = el.getBoundingClientRect();
                    const availW = r.width - 8, availH = r.height - 8;
                    // tall boards on narrow screens; on wide/short screens tiles stretch (up to ~1.9:1) so the board fills the sides
                    const H = Math.max(200, Math.floor(Math.min(availH, availW * 1.25)));
                    const chTile = (H - 2 - 36) / 10;
                    const W = Math.max(160, Math.floor(Math.min(availW, 15.2 * chTile + 30)));
                    setBoardW(W); setBoardH(H);
                };
                calc();
                const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(calc) : null;
                if (ro) ro.observe(el);
                window.addEventListener('resize', calc);
                return () => { if (ro) ro.disconnect(); window.removeEventListener('resize', calc); };
            }, [vp]);

            const buildBoard = (selectedMode, lvl) => {
                let initialCols = [];
                for (let i = 0; i < 8; i++) {
                    let col = [];
                    for (let j = 0; j < 5; j++) col.push(generateCard(selectedMode, lvl, 0));
                    initialCols.push(applyColumnPhysics(col));
                }
                return initialCols;
            };

            const initGame = (selectedMode) => {
                Snd.init();
                runOver.current = false;
                announced.current = {};
                lastMoveRef.current = { moves: 0, score: 0, level: 1 };
                setBankedScore(0);
                levelMs.current = 0;
                setLastClear(null);
                lifeAdd('runs', 1);
                clearSave();
                setModeKey(selectedMode);
                setLevel(1);
                setScore(0);
                setMoves(0);
                setMolecules({});
                setRooms(generateRooms(1, selectedMode));
                setClueQueue([]);
                setSelected(null);
                setColumns(buildBoard(selectedMode, 1));
                setStarted(true);
                setActiveModal(null);
                if (bgmOn) Snd.startMusic();
            };

            const continueRun = () => {
                const sv = loadSave();
                if (!sv) return;
                Snd.init();
                runOver.current = false;
                setModeKey(sv.modeKey);
                setLevel(sv.level);
                setScore(sv.score);
                setMoves(sv.moves);
                setMolecules(sv.molecules || {});
                setRooms(sv.rooms);
                setBankedScore(sv.bankedScore || 0);
                levelMs.current = sv.levelMs || 0;
                announced.current = {};
                if (typeof sv.globalSolves === 'number') setGlobalSolves(sv.globalSolves);
                setClueQueue([]);
                setSelected(null);
                setColumns(buildBoard(sv.modeKey, sv.level));
                setStarted(true);
                setActiveModal(null);
                if (bgmOn) Snd.startMusic();
            };

            // ---- personal records + lifetime stats ----
            const levelMs = useRef(0);       // active play time on the current level
            const lifePending = useRef(0);
            const modalRef = useRef(null);
            modalRef.current = activeModal;
            const [lastClear, setLastClear] = useState(null);

            const recordStat = (key, value) => {
                const def = STAT_DEFS.find(d => d.k === key);
                if (!def || !(value > 0)) return;
                const recs = loadRecords();
                const r = recs[modeKey] || (recs[modeKey] = {});
                const prev = r[key] && r[key].v > 0 ? r[key].v : 0;
                const better = !prev || (def.dir === 'min' ? value < prev : value > prev);
                if (!better) return;
                r[key] = { v: value, lvl: level, t: Date.now() };
                savePref(REC_KEY, recs);
                if (prev && key !== 'most' && !announced.current[modeKey + key]) {
                    announced.current[modeKey + key] = true;
                    Snd.combo(3);
                    addToast(`New record: ${def.title}!`, "🏆", "bg-yellow-500 text-black border-yellow-300");
                }
            };
            const recordLevelClear = () => {
                const sec = Math.max(1, Math.round(levelMs.current / 1000));
                const mv = Math.max(1, moves);
                const ppm = Math.round((score / mv) * 10) / 10;
                recordStat('fastest', sec); recordStat('fewest', mv); recordStat('most', mv); recordStat('ppm', ppm);
                lifeAdd('levels', 1);
                setLastClear({ sec, moves: mv, ppm });
            };

            // play-time clock: only counts while a puzzle is on screen
            useEffect(() => {
                if (!started) return;
                const iv = setInterval(() => {
                    if (document.hidden || runOver.current || modalRef.current !== null) return;
                    levelMs.current += 500; lifePending.current += 500;
                    if (lifePending.current >= 10000) { lifeAdd('ms', lifePending.current); lifePending.current = 0; }
                }, 500);
                return () => clearInterval(iv);
            }, [started]);

            useEffect(() => {
                if (!started || runOver.current) return;
                const lm = lastMoveRef.current;
                const moved = lm.level === level && moves === lm.moves + 1;
                const gain = moved ? score - lm.score : 0;
                lm.moves = moves; lm.score = score; lm.level = level;
                if (moved) { lifeAdd('moves', 1); if (gain > 0) lifeAdd('points', gain); }
                recordStat('level', level);
                recordStat('total', bankedScore + score);
                recordStat('levelScore', score);
                recordStat('move', gain);
            }, [started, moves, score, level, bankedScore]);

            const masterReset = () => {
                try {
                    const rm = [];
                    for (let i = 0; i < window.localStorage.length; i++) {
                        const k = window.localStorage.key(i);
                        if (/^bioarcade_(save_v1|records_v1|life_v1|best_)/.test(k)) rm.push(k);
                    }
                    rm.forEach(k => window.localStorage.removeItem(k));
                } catch (e) {}
                runOver.current = true;
                announced.current = {};
                lastMoveRef.current = { moves: 0, score: 0, level: 1 };
                levelMs.current = 0; lifePending.current = 0;
                setStarted(false); setScore(0); setMoves(0); setLevel(1); setBankedScore(0);
                setLastClear(null); setSelected(null); setClueQueue([]);
                setActiveModal('setup');
                addToast('All records and progress erased', "🗑️", "bg-red-700 text-white border-red-400");
            };

            // save after every change to the run
            useEffect(() => {
                if (!started || runOver.current || activeModal === 'gameover') return;
                savePref(SAVE_KEY, { v: 1, hyp: HYPOTHESIS_DATA.hypothesis_id, modeKey, level, score, moves, molecules, rooms, globalSolves, bankedScore, levelMs: levelMs.current, t: Date.now() });
            }, [started, activeModal, modeKey, level, score, moves, molecules, rooms, bankedScore]);

            const nextLevel = () => {
                Snd.init();
                const nextLvl = level + 1;
                setLevel(nextLvl);
                setScore(0);
                setMoves(0);
                setSelected(null);
                setBankedScore(b => b + score);
                levelMs.current = 0;
                setMolecules({});
                setRooms(generateRooms(nextLvl, modeKey));
                setClueQueue([]);
                setColumns(buildBoard(modeKey, nextLvl));
                setActiveModal(null);
            };

            const calibratedCount = rooms.filter(r => r.isCalibrated).length;
            useEffect(() => {
                if (started && score >= currentTarget && calibratedCount === 6 && activeModal === null && !clueBlocking) {
                    const t = setTimeout(() => {
                        recordLevelClear();
                        Snd.win();
                        confetti({ particleCount: 300, spread: 150, origin: { y: 0.4 } });
                        setActiveModal('win');
                    }, 700);
                    return () => clearTimeout(t);
                }
            }, [score, calibratedCount, activeModal, currentTarget, clueBlocking, started]);

            // --- 1 CARD = 1 MOLECULE XP EXTRACTION ---
            const routeXPFromDestroyed = (destroyedCards, currentSpecs, currentRooms) => {
                let nextSpecs = { ...currentSpecs };
                let affectedMolecules = new Set();
                let gainedByMolecule = {};

                destroyedCards.forEach(c => {
                    let targetEmoji = null;

                    if (c.type === 'molecule') {
                        targetEmoji = c.emoji;
                    } else if (c.color && c.color !== 'grey') {
                        const room = currentRooms.find(r => r.color === c.color);
                        if (room) targetEmoji = room.conceptEmoji;
                    }

                    if (targetEmoji) {
                        if (!nextSpecs[targetEmoji]) nextSpecs[targetEmoji] = { xp: 0, level: 0, alignment: 0 };
                        else nextSpecs[targetEmoji] = { ...nextSpecs[targetEmoji] };
                        nextSpecs[targetEmoji].xp += 1;
                        nextSpecs[targetEmoji].level = nextSpecs[targetEmoji].xp;
                        gainedByMolecule[targetEmoji] = (gainedByMolecule[targetEmoji] || 0) + 1;
                        affectedMolecules.add(targetEmoji);
                    }
                });

                Object.keys(gainedByMolecule).forEach(emoji => {
                    const room = currentRooms.find(r => r.conceptEmoji === emoji);
                    const target = room ? room.targetLvl : '?';
                    const cur = nextSpecs[emoji].xp;
                    addToast(`+${gainedByMolecule[emoji]} ${emoji} cards (${Math.min(cur, target)}/${target})`, emoji, "bg-emerald-600 text-white border-emerald-400");
                });

                affectedMolecules.forEach(emoji => {
                    const room = currentRooms.find(r => r.conceptEmoji === emoji);
                    if (room && !room.isCalibrated) {
                        if (nextSpecs[emoji].xp >= room.targetLvl) {
                            nextSpecs[emoji].alignment = room.targetAlign;
                            Snd.calibrate();
                            addToast(`💥 Evidence Threshold Met: ${room.conceptName}!`, emoji, "bg-emerald-500 text-white border-emerald-300");
                        } else {
                            const roll = Math.floor(Math.random() * 9) + 1;
                            nextSpecs[emoji].alignment = roll;
                            addToast(`🎲 Align Shift: ${emoji} -> ${roll} (Goal: ${room.targetAlign})`, emoji, "bg-indigo-600 text-white border-indigo-400");
                        }
                    }
                });

                return nextSpecs;
            };

            // --- MOVE-BASED PROGRESSION ---
            const processTurn = (currentCols, wipedPts, currentMoves) => {
                let newCols = currentCols.map(col => applyColumnPhysics(col));
                let isGameOver = false;
                let penalty = 0;
                const nextMovesCount = currentMoves + 1;
                setTimeout(() => Snd.land(), 200);

                if (wipedPts > 0) {
                    setScore(s => s + wipedPts);
                    confetti({ particleCount: 80, spread: 90 });
                }

                const isEmpty = newCols.every(col => col.length === 0);
                if (isEmpty) {
                    Snd.burst();
                    setScore(s => s + 1000);
                    addToast("🌟 CLEAN SWEEP! +1000 INSIGHT! 🌟", "🏆", "bg-yellow-500 text-black border-yellow-300");
                    confetti({ particleCount: 300, spread: 150 });
                }

                // Helper: always drop new cards onto the SHORTEST column(s) so the board fills evenly from the bottom
                const shortestCol = () => {
                    let min = Infinity;
                    newCols.forEach(c => { if (c.length < min) min = c.length; });
                    const ties = [];
                    newCols.forEach((c, i) => { if (c.length === min) ties.push(i); });
                    return ties[Math.floor(Math.random() * ties.length)];
                };

                // 1. Bottom-Row Auto-Fill Guarantee
                for (let i = 0; i < 8; i++) {
                    if (newCols[i].length === 0) newCols[i].push(generateCard(modeKey, level, nextMovesCount));
                }

                // 2. Gentler Turn Influx (ramps up slowly, capped per difficulty)
                const blocksToAdd = Math.min(mode.maxInflux || 5, Math.ceil(nextMovesCount * 0.6));
                for (let i = 0; i < blocksToAdd; i++) {
                    newCols[shortestCol()].push(generateCard(modeKey, level, nextMovesCount));
                }

                // 3. Playability Fallback
                if (!checkValidMoves(newCols)) {
                    newCols[shortestCol()].push({ id: uid(), type: 'heart', emoji: HEART_EMOJIS['red'], color: 'red', number: 0 });
                }

                newCols = newCols.map(col => applyColumnPhysics(col));

                // 4. Ceiling Breach Check
                for (let i = 0; i < 8; i++) {
                    while (newCols[i].length > 10) {
                        const overflow = newCols[i].pop();
                        if (overflow.type === 'block') isGameOver = true;
                        else if (overflow.type === 'molecule') penalty += overflow.number;
                    }
                }

                if (isGameOver) {
                    runOver.current = true;
                    clearSave();
                    Snd.gameover();
                    setActiveModal('gameover');
                    return;
                }
                if (penalty > 0) {
                    setScore(s => Math.max(0, s - penalty));
                    addToast(`Ceiling Bleed: -${penalty} Insight`, "⚠️", "bg-red-600 text-white border-red-400");
                }

                setColumns(newCols);
                setMoves(nextMovesCount);
                setSelected(null);
            };

            // --- AUTO-THESIS CALIBRATION ---
            const triggerAutoThesis = (currentSpecs) => {
                let updatedRooms = [...rooms];
                let changed = false;
                let newlyCalibrated = [];

                updatedRooms.forEach((room, idx) => {
                    if (room.isCalibrated) return;
                    const spec = currentSpecs[room.conceptEmoji];
                    if (!spec) return;

                    const curXP = spec.xp || 0;
                    if (curXP >= room.targetLvl && spec.alignment === room.targetAlign) {
                        updatedRooms[idx] = { ...updatedRooms[idx], isCalibrated: true };
                        changed = true;
                        newlyCalibrated.push(updatedRooms[idx]);
                        Snd.calibrate();
                        confetti({ particleCount: 80, spread: 60, colors: [COLOR_HEX[room.color], "#fff"] });
                        addToast(`Evidence Link Confirmed: ${room.conceptName}!`, room.conceptEmoji, "bg-emerald-600 text-white border-emerald-400");
                    }
                });

                if (changed) {
                    setRooms(updatedRooms);
                    if (clueMode !== 'off') setClueQueue(prev => [...prev, ...newlyCalibrated]);
                }
            };

            // ================= VISUAL FX ENGINE =================
            const bW = Math.round(boardW * zoom), bH = Math.round(boardH * zoom);
            const innerW = bW - 2, innerH = bH - 2;
            const cw = (innerW - 28) / 8, ch = (innerH - 36) / 10;
            const px = (x) => x * (cw + 4), py = (y) => (9 - y) * (ch + 4);
            const cxOf = (x) => px(x) + cw / 2, cyOf = (y) => py(y) + ch / 2;
            const fxId = useRef(0);
            const shakeN = useRef(0);
            const shakeTimer = useRef(null);
            const streakRef = useRef({ n: 0, t: 0 });
            const [fx, setFx] = useState([]);
            const [shake, setShake] = useState({ n: 0, lvl: 0 });

            const cardFace = (c) => c.type === 'block' ? (c.subType === 'float' ? '🎈' : '⚓') : c.emoji;
            const addFx = (items, life = 1200) => {
                if (!fxOn || !items.length) return;
                const tagged = items.map(it => ({ ...it, id: ++fxId.current }));
                setFx(prev => [...prev, ...tagged].slice(-180));
                setTimeout(() => setFx(prev => prev.filter(f => !tagged.some(t => t.id === f.id))), life);
            };
            const doShake = (lvl) => {
                if (!fxOn) return;
                shakeN.current += 1;
                setShake({ n: shakeN.current, lvl });
                clearTimeout(shakeTimer.current);
                shakeTimer.current = setTimeout(() => setShake({ n: 0, lvl: 0 }), lvl === 2 ? 600 : 400);
            };
            const bumpStreak = () => {
                const now = Date.now(), st = streakRef.current;
                st.n = (now - st.t > 4000) ? 0 : st.n + 1;
                st.t = now;
                recordStat('streak', st.n + 1);
                return st.n;
            };
            const makeParts = (total) => {
                const count = total > 40 ? 0 : total > 20 ? 2 : 4;
                return Array.from({ length: count }, () => {
                    const a = Math.random() * Math.PI * 2, r = 18 + Math.random() * 30;
                    return { dx: Math.cos(a) * r, dy: Math.sin(a) * r };
                });
            };
            const ghostsFrom = (list, ox, oy, base, perDist) => list.map(({ col, row, card }) => ({
                t: 'ghost', x: col, y: row, face: cardFace(card), color: card.color,
                delay: base + Math.min(420, Math.hypot(col - ox, row - oy) * perDist), parts: makeParts(list.length)
            }));
            const ringFx = (x, y, color, size, delay = 0) => ({ t: 'ring', cx: cxOf(x), cy: cyOf(y), color, size, delay });
            const textFx = (cx, cy, text, color = '#fde047', size = 18, delay = 0) => ({ t: 'text', cx, cy, text, color, size, delay });

            const numFx = (cx, cy, text, color, size, delay) => ({ t: 'num', cx, cy, text, color, size, delay, drift: (Math.random() - 0.5) * 36, rise: 40 + Math.random() * 40 });
            // big toast: tier word + the TOTAL points for the move
            const moveToast = (pts, n) => {
                const byCount = n >= 25 ? 4 : n >= 15 ? 3 : n >= 8 ? 2 : n >= 4 ? 1 : 0;
                const byPts = pts >= 1800 ? 4 : pts >= 900 ? 3 : pts >= 400 ? 2 : pts >= 150 ? 1 : 0;
                const tier = Math.max(byCount, byPts);
                if (tier) Snd.combo(tier);
                addFx([{ t: 'toast', delay: 250, total: pts, word: ['', 'NICE!', 'GREAT!', 'AMAZING!', 'INSANE!!'][tier],
                    color: ['#fde047', '#86efac', '#fde047', '#fb923c', '#f472b6'][tier], size: Math.round(innerW * (0.06 + tier * 0.013)) }], 1700);
            };

            // clears caused by power-ups
            const burstFx = (kind, ox, oy, list, opt = {}) => {
                if (!fxOn) return;
                const gold = '#fde047';
                const items = [];
                const d0 = kind === 'dynamite' ? 140 : kind === 'rocket' ? 60 : 0;
                items.push(...ghostsFrom(list, ox, oy, d0, kind === 'heart' ? 34 : 24));
                const hex = COLOR_HEX[opt.color] || '#ffffff';
                if (kind === 'rocket') {
                    items.push({ t: 'beamV', x: ox, color: '#93c5fd', delay: 40 });
                    items.push({ t: 'rocket', cx: cxOf(ox), cy: cyOf(oy), dir: -1, dist: cyOf(oy) + 30 });
                    items.push({ t: 'rocket', cx: cxOf(ox), cy: cyOf(oy), dir: 1, dist: innerH - cyOf(oy) + 30 });
                    items.push(ringFx(ox, oy, '#60a5fa', cw * 2.4));
                    doShake(1);
                } else if (kind === 'dynamite') {
                    items.push({ t: 'spark', cx: cxOf(ox), cy: cyOf(oy) });
                    items.push({ t: 'beamH', y: oy, color: '#fdba74', delay: 140 });
                    items.push({ t: 'flare', cx: cxOf(ox), cy: cyOf(oy), dir: -1, dist: cxOf(ox) + 30, delay: 140 });
                    items.push({ t: 'flare', cx: cxOf(ox), cy: cyOf(oy), dir: 1, dist: innerW - cxOf(ox) + 30, delay: 140 });
                    items.push(ringFx(ox, oy, '#fb923c', cw * 2.6, 140));
                    doShake(1);
                } else if (kind === 'heart') {
                    items.push(ringFx(ox, oy, hex, innerW * 1.3));
                    items.push({ t: 'flash', color: hex, alpha: 0.22 });
                    list.slice(0, 8).forEach(g => items.push({ t: 'float', cx: cxOf(g.col), cy: cyOf(g.row), emoji: HEART_EMOJIS[opt.color] || '❤️', drift: (Math.random() - 0.5) * 40, delay: Math.min(300, Math.hypot(g.col - ox, g.row - oy) * 34) }));
                    if (list.length >= 14) doShake(1);
                } else if (kind === 'mega') {
                    items.push({ t: 'flash', color: '#ffffff', alpha: 0.5 });
                    items.push(ringFx(ox, oy, '#f472b6', innerW * 1.6));
                    items.push(ringFx(ox, oy, gold, innerW * 1.1, 120));
                    items.push(textFx(innerW / 2, innerH * 0.28, 'MEGA BLAST!', '#f472b6', Math.round(innerW * 0.085)));
                    doShake(2);
                } else if (kind === 'hammerHit' || kind === 'hammerShatter') {
                    items.push({ t: 'hammer', cx: cxOf(ox), cy: cyOf(oy) });
                    items.push(ringFx(ox, oy, '#c084fc', cw * 2.4, 120));
                    doShake(1);
                } else if (kind === 'hammerBlast') {
                    [[ox, oy], [opt.ox2, opt.oy2]].forEach(([bx, by]) => {
                        items.push({ t: 'blast3', x: bx, y: by });
                        items.push(ringFx(bx, by, '#f97316', cw * 4.2));
                        items.push({ t: 'boom', cx: cxOf(bx), cy: cyOf(by) });
                    });
                    items.push({ t: 'flash', color: '#fb923c', alpha: 0.35 });
                    doShake(2);
                }
                // every cleared card flies out its own score: base 25 + the card's number (e.g. 25+18 = 43)
                const valOf = opt.perFn || ((c) => cardPts(c));
                const pts = list.reduce((a, g) => a + valOf(g.card), 0) + (opt.bonus || 0);
                const numSize = Math.round(innerW * (list.length > 12 ? 0.04 : 0.05));
                const hues = ['#fde047', '#ffffff', '#fb923c', '#86efac'];
                list.slice(0, 60).forEach((g, i) => {
                    const v = valOf(g.card);
                    if (v > 0) items.push(numFx(cxOf(g.col), cyOf(g.row), `+${v}`, hues[i % 4], numSize,
                        d0 + 80 + Math.min(420, Math.hypot(g.col - ox, g.row - oy) * 24)));
                });
                addFx(items, 1500);
                moveToast(pts, list.length);
            };

            // pair matches and forged power-ups
            const matchFx = (kind, a, b, horiz, pts, streak) => {
                if (!fxOn) return;
                const items = [];
                const gold = '#fde047';
                const mx = (cxOf(a.col) + cxOf(b.col)) / 2, my = (cyOf(a.row) + cyOf(b.row)) / 2;
                const toward = (g, tx, ty) => ({ t: 'ghost', x: g.col, y: g.row, face: cardFace(g.card), color: g.card.color, delay: 0, merge: true, parts: [], mx: tx - cxOf(g.col), my: ty - cyOf(g.row) });
                if (kind === 'forge') {
                    items.push(toward(a, cxOf(b.col), cyOf(b.row)));
                    items.push({ t: 'link', x1: cxOf(a.col), y1: cyOf(a.row), x2: cxOf(b.col), y2: cyOf(b.row) });
                    items.push({ t: 'ring', cx: cxOf(b.col), cy: cyOf(b.row), color: gold, size: cw * 3.2, delay: 140 });
                    items.push({ t: 'sparkles', cx: cxOf(b.col), cy: cyOf(b.row), delay: 140 });
                    items.push(textFx(cxOf(b.col), cyOf(b.row) - ch * 0.7, horiz ? '🧨 FORGED!' : '🚀 FORGED!', gold, Math.round(innerW * 0.06), 140));
                    items.push(numFx(cxOf(b.col), cyOf(b.row), `+${pts}`, '#ffffff', Math.round(innerW * 0.055), 220));
                    doShake(0);
                } else {
                    items.push(toward(a, mx, my));
                    items.push(toward(b, mx, my));
                    items.push({ t: 'ring', cx: mx, cy: my, color: COLOR_HEX[b.card.color] || '#fff', size: cw * 2.2, delay: 200 });
                    items.push({ t: 'sparkles', cx: mx, cy: my, delay: 200, small: true });
                    const h1 = Math.ceil(pts / 2), h2 = pts - h1;
                    items.push(numFx(cxOf(a.col), cyOf(a.row), `+${h1}`, '#fde047', Math.round(innerW * 0.045), 0));
                    items.push(numFx(cxOf(b.col), cyOf(b.row), `+${h2}`, '#ffffff', Math.round(innerW * 0.045), 40));
                }
                if (streak >= 2) items.push(textFx(innerW / 2, innerH * 0.12, `STREAK x${streak + 1}`, '#67e8f9', Math.round(innerW * 0.06), 100));
                addFx(items, 1400);
                moveToast(pts, 2);
            };

            // chain reaction wrapper that also tracks the biggest clear
            const chain = (queue, cols) => { const res = executeChainReaction(queue, cols); recordStat('bigClear', res.wipedCardsCount); return res; };

            // --- USER INTERACTION HANDLER ---
            const handleCardClick = (colIdx, rowIdx, card) => {
                if (activeModal || clueBlocking) return;
                Snd.init();

                if (card.type === 'block') {
                    if (!(selected && selected.card.type === 'hammer')) {
                        addToast(`Hazards cannot be paired! Use a Heart, Line Clear, or Hammer!`, card.emoji, "bg-red-600 text-white border-red-400");
                        setSelected(null);
                        return;
                    }
                }

                if (!selected) {
                    if (card.type === 'heart' || card.type === 'h_clear' || card.type === 'v_clear') {
                        let initialQueue = [{ col: colIdx, row: rowIdx, card: card }];
                        const { newCols, wipedCardsCount, destroyedCards, destroyedList } = chain(initialQueue, columns);

                        let newSpecs = routeXPFromDestroyed(destroyedCards, molecules, rooms);
                        setMolecules(newSpecs);
                        triggerAutoThesis(newSpecs);

                        if (card.type === 'heart') { Snd.heartPop(); burstFx('heart', colIdx, rowIdx, destroyedList, { color: card.color }); }
                        else if (card.type === 'h_clear') { Snd.dynamite(); burstFx('dynamite', colIdx, rowIdx, destroyedList); }
                        else { Snd.rocket(); burstFx('rocket', colIdx, rowIdx, destroyedList); }
                        if (card.type === 'heart') addToast(`Data Blast: ${card.color.toUpperCase()}!`, card.emoji, "bg-rose-600 text-white border-rose-400");
                        else if (card.type === 'h_clear') addToast(`Row Cleared!`, card.emoji, "bg-amber-500 text-white border-amber-400");
                        else if (card.type === 'v_clear') addToast(`Column Cleared!`, card.emoji, "bg-blue-500 text-white border-blue-400");

                        processTurn(newCols, clearPts(destroyedList), moves);
                        return;
                    }
                    Snd.select();
                    setSelected({ col: colIdx, row: rowIdx, card });
                    return;
                }

                if (selected.col === colIdx && selected.row === rowIdx) { setSelected(null); return; }

                const c1 = selected.card, c2 = card;
                let newCols = columns.map(c => [...c]);

                const removeSelectedCards = () => {
                    if (selected.col === colIdx) {
                        if (selected.row > rowIdx) { newCols[selected.col].splice(selected.row, 1); newCols[colIdx].splice(rowIdx, 1); }
                        else { newCols[colIdx].splice(rowIdx, 1); newCols[selected.col].splice(selected.row, 1); }
                    } else { newCols[selected.col].splice(selected.row, 1); newCols[colIdx].splice(rowIdx, 1); }
                };

                // COMBO: HAMMER + EXPLOSIVE
                if ((c1.type === 'hammer' && ['heart', 'h_clear', 'v_clear'].includes(c2.type)) ||
                    (c2.type === 'hammer' && ['heart', 'h_clear', 'v_clear'].includes(c1.type))) {
                    let explosiveCard = c1.type === 'hammer' ? c2 : c1;
                    let initialQueue = [];
                    columns.forEach((col, c) => col.forEach((cd, r) => {
                        if (cd.type === explosiveCard.type) initialQueue.push({ col: c, row: r, card: cd });
                    }));

                    const res = chain(initialQueue, columns);
                    let newSpecs = routeXPFromDestroyed(res.destroyedCards, molecules, rooms);
                    setMolecules(newSpecs);
                    triggerAutoThesis(newSpecs);

                    Snd.hammerBlast();
                    burstFx('mega', colIdx, rowIdx, res.destroyedList);
                    addToast(`MEGA DETONATION!`, "💥", "bg-pink-600 text-white border-pink-400");
                    confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
                    processTurn(res.newCols, clearPts(res.destroyedList), moves);
                    return;
                }

                // COMBO: HAMMER + HAMMER -> both hammers explode in a 3x3 area (chains like other bombs)
                if (c1.type === 'hammer' && c2.type === 'hammer') {
                    let initialQueue = [
                        { col: selected.col, row: selected.row, card: c1, blast: true },
                        { col: colIdx, row: rowIdx, card: c2, blast: true }
                    ];
                    const res = chain(initialQueue, columns);
                    let newSpecs = routeXPFromDestroyed(res.destroyedCards, molecules, rooms);
                    setMolecules(newSpecs);
                    triggerAutoThesis(newSpecs);
                    Snd.hammerBlast();
                    burstFx('hammerBlast', selected.col, selected.row, res.destroyedList, { ox2: colIdx, oy2: rowIdx });
                    addToast(`HAMMER BLAST: Broke ${res.wipedCardsCount} Instruments!`, "🔨", "bg-purple-600 text-white border-purple-400");
                    confetti({ particleCount: 120, spread: 90, origin: { y: 0.5 } });
                    processTurn(res.newCols, clearPts(res.destroyedList), moves);
                    return;
                }

                // COMBO: HAMMER + HAZARD
                if ((c1.type === 'hammer' && c2.type === 'block') || (c2.type === 'hammer' && c1.type === 'block')) {
                    let initialQueue = [{ col: selected.col, row: selected.row, card: c1 }, { col: colIdx, row: rowIdx, card: c2 }];
                    const res = chain(initialQueue, columns);
                    let newSpecs = routeXPFromDestroyed(res.destroyedCards, molecules, rooms);
                    setMolecules(newSpecs);
                    triggerAutoThesis(newSpecs);
                    Snd.hammerHit();
                    burstFx('hammerHit', colIdx, rowIdx, res.destroyedList, { perFn: c => c.type === 'block' ? 90 : 0 });
                    setScore(s => s + 90);
                    addToast(`Smashed Hazard Clock! (+90)`, "🔨", "bg-purple-700 text-white border-purple-400");
                    processTurn(res.newCols, 0, moves);
                    return;
                }

                // COMBO: HAMMER + MOLECULE
                if ((c1.type === 'hammer' && c2.type === 'molecule') || (c2.type === 'hammer' && c1.type === 'molecule')) {
                    const targetMolecule = c1.type === 'molecule' ? c1 : c2;
                    let initialQueue = [{ col: selected.col, row: selected.row, card: c1 }, { col: colIdx, row: rowIdx, card: c2 }];
                    columns.forEach((col, c) => col.forEach((cd, r) => { if (cd.emoji === targetMolecule.emoji) initialQueue.push({ col: c, row: r, card: cd }); }));

                    const res = chain(initialQueue, columns);
                    let newSpecs = routeXPFromDestroyed(res.destroyedCards, molecules, rooms);
                    setMolecules(newSpecs);
                    triggerAutoThesis(newSpecs);

                    Snd.hammerHit();
                    const shatterFn = (c) => c.type === 'hammer' ? 0 : 30 + (c.number || 0);
                    const shatterPts = res.destroyedList.reduce((a, g) => a + shatterFn(g.card), 0) + 20;
                    { const tp = c1.type === 'molecule' ? { x: selected.col, y: selected.row } : { x: colIdx, y: rowIdx };
                      burstFx('hammerShatter', tp.x, tp.y, res.destroyedList, { perFn: shatterFn, bonus: 20 }); }
                    setScore(s => s + shatterPts);
                    addToast(`Shattered ${res.wipedCardsCount - 1} ${targetMolecule.emoji}! (+${shatterPts})`, "🔨", "bg-purple-700 text-white border-purple-400");
                    processTurn(res.newCols, 0, moves);
                    return;
                }

                // COMBO: REGULAR MOLECULE PAIRING
                if (c1.type === 'molecule' && c2.type === 'molecule' && (c1.emoji === c2.emoji || c1.color === c2.color || c1.number === c2.number)) {
                    // Side-by-side match -> Dynamite, stacked match -> Rocket (replaces the tapped card, other card is consumed)
                    const sideBySide = selected.row === rowIdx && Math.abs(selected.col - colIdx) === 1;
                    const stacked = selected.col === colIdx && Math.abs(selected.row - rowIdx) === 1;
                    const forged = sideBySide || stacked;
                    const pts = (c1.number * c2.number) + 15;
                    const posA = { col: selected.col, row: selected.row, card: c1 }, posB = { col: colIdx, row: rowIdx, card: c2 };
                    const streakN = bumpStreak();
                    if (forged) {
                        newCols[colIdx][rowIdx] = sideBySide
                            ? { id: uid(), type: 'h_clear', emoji: '🧨', color: c2.color, number: 0, anim: 'forge' }
                            : { id: uid(), type: 'v_clear', emoji: '🚀', color: c2.color, number: 0, anim: 'forge' };
                        newCols[selected.col].splice(selected.row, 1);
                        addToast(sideBySide ? `Side-by-side match forged a Dynamite! 🧨` : `Stacked match forged a Rocket! 🚀`, sideBySide ? "🧨" : "🚀", "bg-orange-600 text-white border-orange-300");
                        matchFx('forge', posA, posB, sideBySide, pts, streakN);
                        Snd.forge();
                        lifeAdd('forged');
                    } else {
                        removeSelectedCards();
                        matchFx('match', posA, posB, false, pts, streakN);
                        Snd.matchStep(streakN);
                        lifeAdd('matches');
                    }
                    setScore(s => s + pts);

                    let newSpecs = { ...molecules };

                    [c1, c2].forEach(cd => {
                        const emoji = cd.emoji;
                        newSpecs[emoji] = newSpecs[emoji] ? { ...newSpecs[emoji] } : { xp: 0, level: 0, alignment: 0 };
                        newSpecs[emoji].xp += 1;
                        newSpecs[emoji].level = newSpecs[emoji].xp;
                    });

                    const isExactMatch = (c1.emoji === c2.emoji);
                    const targetEmoji = c1.emoji;
                    const targetRoom = rooms.find(r => r.conceptEmoji === targetEmoji);

                    if (isExactMatch) {
                        const roomTarget = targetRoom ? targetRoom.targetLvl : '?';
                        const curXP = newSpecs[targetEmoji].xp;
                        addToast(`+2 ${targetEmoji} Synthesis (${Math.min(curXP, roomTarget)}/${roomTarget})`, targetEmoji, "bg-emerald-600 text-white border-emerald-400");
                    } else {
                        addToast(`+1 ${c1.emoji} & +1 ${c2.emoji} Synthesis!`, "🔬", "bg-emerald-600 text-white border-emerald-400");
                    }

                    if (targetRoom && !targetRoom.isCalibrated && isExactMatch && newSpecs[targetEmoji].xp >= targetRoom.targetLvl) {
                        newSpecs[targetEmoji].alignment = targetRoom.targetAlign;
                        Snd.calibrate();
                        addToast(`🎯 Evidence Link Unlocked: ${targetRoom.conceptName}!`, targetEmoji, "bg-emerald-500 text-white border-emerald-300");
                    } else {
                        if (c1.number === c2.number) {
                            newSpecs[targetEmoji].alignment = alignOf(c1.number);
                            addToast(`🎲 Pair Match: Align set to ${alignOf(c1.number)}! (Goal: ${targetRoom ? targetRoom.targetAlign : '?'})`, targetEmoji, "bg-cyan-700 text-white border-cyan-400");
                        } else if (targetRoom && (alignOf(c1.number) === targetRoom.targetAlign || alignOf(c2.number) === targetRoom.targetAlign)) {
                            newSpecs[targetEmoji].alignment = targetRoom.targetAlign;
                            addToast(`🎯 Lock Match: Alignment ${targetRoom.targetAlign} Locked!`, targetEmoji, "bg-cyan-600 text-white border-cyan-400");
                        } else if (targetRoom) {
                            const roll = Math.floor(Math.random() * 9) + 1;
                            newSpecs[targetEmoji].alignment = roll;
                            addToast(`🎲 Alignment Shift: Rolled ${roll} (Goal: ${targetRoom.targetAlign})`, targetEmoji, "bg-indigo-600 text-white border-indigo-400");
                        }
                    }

                    setMolecules(newSpecs);
                    triggerAutoThesis(newSpecs);
                    processTurn(newCols, 0, moves);
                    return;
                }

                setSelected(null);
            };

            const progressPct = Math.min(100, (score / currentTarget) * 100);

            const digHyp = String(HYPOTHESIS_DATA.main_claim || '').slice(0, 500);
            const digPrompt = "I am using PathMap Alchemy and it made this literature based hypothesis discovery. Is it real? Is it new and unpublished? What impact on the world would occur if true. Explain it to me.\n\nHypothesis: " + digHyp;
            const googleSearchUrl = "https://www.google.com/search?q=" + encodeURIComponent(digPrompt);
            const chatGptUrl = "https://chatgpt.com/?q=" + encodeURIComponent(digPrompt);

            const renderFx = (f) => {
                const d = f.delay || 0;
                switch (f.t) {
                    case 'ghost': return (
                        <React.Fragment key={f.id}>
                            <div style={{ position: 'absolute', left: px(f.x), top: py(f.y), width: cw, height: ch, '--mx': (f.mx || 0) + 'px', '--my': (f.my || 0) + 'px',
                                animation: f.merge ? `ghostMerge 0.32s ${d}ms ease-in both` : `ghostOut 0.4s ${d}ms ease-in both` }}
                                className={`rounded-lg flex items-center justify-center border-b-4 ${TILE_CLASSES[f.color] || 'tile-grey'}`}>
                                <span style={{ fontSize: tilePx * 0.5 }}>{f.face}</span>
                            </div>
                            {f.parts.map((pt, i) => (
                                <span key={i} style={{ position: 'absolute', left: cxOf(f.x) - 3, top: cyOf(f.y) - 3, width: 6, height: 6, borderRadius: '50%',
                                    background: COLOR_HEX[f.color] || '#fff', boxShadow: `0 0 6px ${COLOR_HEX[f.color] || '#fff'}`,
                                    '--dx': pt.dx + 'px', '--dy': pt.dy + 'px', animation: `part 0.5s ${d + 60}ms ease-out both` }} />
                            ))}
                        </React.Fragment>
                    );
                    case 'ring': return <div key={f.id} style={{ position: 'absolute', left: f.cx - f.size / 2, top: f.cy - f.size / 2, width: f.size, height: f.size, borderRadius: '50%',
                        border: `4px solid ${f.color}`, boxShadow: `0 0 18px ${f.color}, inset 0 0 14px ${f.color}`, animation: `ring 0.55s ${d}ms ease-out both` }} />;
                    case 'beamV': return <div key={f.id} style={{ position: 'absolute', left: px(f.x) - 2, top: 0, width: cw + 4, height: '100%',
                        background: `linear-gradient(90deg, transparent, ${f.color}, #fff, ${f.color}, transparent)`, mixBlendMode: 'screen', animation: `beam 0.45s ${d}ms ease-out both` }} />;
                    case 'beamH': return <div key={f.id} style={{ position: 'absolute', top: py(f.y) - 2, left: 0, height: ch + 4, width: '100%',
                        background: `linear-gradient(180deg, transparent, ${f.color}, #fff, ${f.color}, transparent)`, mixBlendMode: 'screen', animation: `beam 0.45s ${d}ms ease-out both` }} />;
                    case 'rocket': {
                        const up = f.dir < 0;
                        return (
                            <div key={f.id} style={{ position: 'absolute', left: f.cx - 14, top: f.cy - 14, width: 28, height: 28, '--dist': (f.dir * f.dist) + 'px', animation: `moveY 0.5s ${d + 60}ms cubic-bezier(.5,0,.9,.6) both` }}>
                                <div style={{ position: 'absolute', left: 11, top: up ? 22 : -46, width: 6, height: 48, borderRadius: 6,
                                    background: up ? 'linear-gradient(to bottom, #fde047, #f97316 50%, transparent)' : 'linear-gradient(to top, #fde047, #f97316 50%, transparent)' }} />
                                <span style={{ position: 'absolute', inset: 0, fontSize: 26, lineHeight: '28px', textAlign: 'center', transform: `rotate(${up ? -45 : 135}deg)` }}>🚀</span>
                            </div>
                        );
                    }
                    case 'flare': {
                        const left = f.dir < 0;
                        return (
                            <div key={f.id} style={{ position: 'absolute', left: f.cx - 14, top: f.cy - 14, width: 28, height: 28, '--dist': (f.dir * f.dist) + 'px', animation: `moveX 0.45s ${d}ms cubic-bezier(.4,0,.8,.6) both` }}>
                                <div style={{ position: 'absolute', top: 11, left: left ? 22 : -46, height: 6, width: 48, borderRadius: 6,
                                    background: left ? 'linear-gradient(to right, #fde047, #f97316 50%, transparent)' : 'linear-gradient(to left, #fde047, #f97316 50%, transparent)' }} />
                                <span style={{ position: 'absolute', inset: 0, fontSize: 24, lineHeight: '28px', textAlign: 'center' }}>🔥</span>
                            </div>
                        );
                    }
                    case 'spark': return <div key={f.id} style={{ position: 'absolute', left: f.cx - 16, top: f.cy - 16, fontSize: 28, lineHeight: '32px', width: 32, textAlign: 'center', animation: 'spark 0.14s linear 1 both' }}>✨</div>;
                    case 'float': return <div key={f.id} style={{ position: 'absolute', left: f.cx - 12, top: f.cy - 12, fontSize: 22, '--drift': f.drift + 'px', animation: `heartFloat 0.9s ${d}ms ease-out both` }}>{f.emoji}</div>;
                    case 'hammer': { const sz = cw * 0.9; return <div key={f.id} style={{ position: 'absolute', left: f.cx - sz / 2, top: f.cy - sz / 2, fontSize: sz, lineHeight: 1, animation: 'hammerSwing 0.45s ease-in both' }}>🔨</div>; }
                    case 'blast3': return <div key={f.id} style={{ position: 'absolute', left: px(f.x - 1) - 2, top: py(f.y + 1) - 2, width: 3 * cw + 12, height: 3 * ch + 12, borderRadius: 12, border: '3px solid #fb923c',
                        background: 'radial-gradient(circle, rgba(253,224,71,.6), rgba(249,115,22,.2) 60%, transparent)', animation: 'blast3 0.5s ease-out both' }} />;
                    case 'boom': return <div key={f.id} style={{ position: 'absolute', left: f.cx, top: f.cy, fontSize: cw * 1.6, lineHeight: 1, animation: 'boom 0.5s ease-out both' }}>💥</div>;
                    case 'flash': return <div key={f.id} style={{ position: 'absolute', inset: 0, background: f.color, '--a': f.alpha, animation: 'flash 0.35s ease-out both' }} />;
                    case 'link': {
                        const dx = f.x2 - f.x1, dy = f.y2 - f.y1, len = Math.hypot(dx, dy) + cw * 0.5, ang = Math.atan2(dy, dx) * 180 / Math.PI;
                        return (
                            <div key={f.id} style={{ position: 'absolute', left: (f.x1 + f.x2) / 2 - len / 2, top: (f.y1 + f.y2) / 2 - 5, width: len, height: 10, transform: `rotate(${ang}deg)` }}>
                                <div style={{ width: '100%', height: '100%', borderRadius: 6, background: 'linear-gradient(90deg,#fde047,#fff,#fde047)', boxShadow: '0 0 16px #fde047', animation: 'linkPulse 0.5s ease-out both' }} />
                            </div>

                    }
                    case 'sparkles': return (
                        <React.Fragment key={f.id}>
                            {Array.from({ length: f.small ? 4 : 7 }, (_, i) => {
                                const a = (i / (f.small ? 4 : 7)) * Math.PI * 2 + 0.4, r = (f.small ? 26 : 44);
                                return <span key={i} style={{ position: 'absolute', left: f.cx - 8, top: f.cy - 8, fontSize: 16, '--dx': Math.cos(a) * r + 'px', '--dy': Math.sin(a) * r + 'px', animation: `part 0.7s ${d}ms ease-out both` }}>✨</span>;
                            })}
                        </React.Fragment>
                    );
                    case 'toast': return (
                        <div key={f.id} style={{ position: 'absolute', left: innerW / 2, top: innerH * 0.38, transform: 'translate(-50%,-50%)', textAlign: 'center', whiteSpace: 'nowrap' }}>
                            <div className="mono" style={{ fontWeight: 900, lineHeight: 1.05, animation: `floatText 1.4s ${d}ms ease-out both` }}>
                                {f.word && <div style={{ fontSize: f.size, color: f.color, textShadow: `0 2px 0 #000, 0 0 14px ${f.color}` }}>{f.word}</div>}
                                <div style={{ fontSize: Math.round(f.size * 1.15), color: '#fff7ae', textShadow: '0 2px 0 #000, 0 0 12px #fde047' }}>+{f.total.toLocaleString()}</div>
                            </div>
                        </div>
                    );
                    case 'num': return (
                        <div key={f.id} style={{ position: 'absolute', left: f.cx, top: f.cy, transform: 'translate(-50%,-50%)', whiteSpace: 'nowrap' }}>
                            <div className="mono" style={{ fontSize: f.size, color: f.color, fontWeight: 900, textShadow: `0 1px 0 #000, 0 0 8px ${f.color}`, '--drift': f.drift + 'px', '--rise': f.rise + 'px', animation: `numFly 0.9s ${d}ms ease-out both` }}>{f.text}</div>
                        </div>
                    );
                    case 'text': return (
                        <div key={f.id} style={{ position: 'absolute', left: f.cx, top: f.cy, transform: 'translate(-50%,-50%)', whiteSpace: 'nowrap' }}>
                            <div className="mono" style={{ fontSize: f.size, color: f.color, fontWeight: 900, textShadow: `0 2px 0 #000, 0 0 12px ${f.color}`, animation: `floatText 1s ${d}ms ease-out both` }}>{f.text}</div>
                        </div>
                    );
                    default: return null;
                }
            };

            const savedRun = activeModal === 'setup' ? loadSave() : null;
            const bests = {};
            if (activeModal === 'setup') { const rr = loadRecords(); Object.keys(MODES).forEach(k => { if (rr[k] && rr[k].level && rr[k].level.v) bests[k] = { level: rr[k].level.v }; }); }
            const VpIcon = VIEWPORT_ICONS[vp];
            const tilePx = Math.min(cw, ch * 1.2);
            const iconBtn = "icon-btn w-10 h-10 rounded-xl border flex items-center justify-center active:scale-90 transition-transform";
            const sfxLabelOn = sfxOn ? "border-emerald-700 text-emerald-300 bg-emerald-950/60" : "border-zinc-700 text-zinc-500 bg-zinc-900";

            return (
                <div className={`app-bg ts-${textScale} flex flex-col w-full mx-auto relative overflow-hidden`} style={{ height: '100dvh', maxWidth: VIEWPORTS[vp].maxW, paddingTop: 'env(safe-area-inset-top, 0px)', boxSizing: 'border-box' }}>

                    {/* SCIENTIFIC CLUE MODAL */}
                    {clueMode === 'banner' && clueQueue.length > 0 && activeModal === null && (
                        <div className="absolute left-2 right-2 bottom-14 z-[55] pointer-events-none flex justify-center">
                            <div className="pointer-events-auto bg-black/85 border border-emerald-500 rounded-xl p-2.5 max-w-md w-full shadow-[0_0_18px_#10b98188] flex items-start gap-2.5">
                                <div className="text-3xl shrink-0">{clueQueue[0].conceptEmoji}</div>
                                <div className="min-w-0 flex-1">
                                    <div className="mono text-[10px] font-black uppercase tracking-widest text-emerald-400">🔬 {clueQueue[0].conceptName} evidence link confirmed • PMID {clueQueue[0].pmid}</div>
                                    <div className="text-[11px] text-gray-300 font-serif italic leading-snug line-clamp-5">"{clueQueue[0].quote}"</div>
                                </div>
                                <button onClick={() => setClueQueue(q => q.slice(1))} className="shrink-0 w-7 h-7 rounded-lg border border-emerald-700 text-emerald-300 flex items-center justify-center active:scale-90"><IconX size={14} /></button>
                            </div>
                        </div>
                    )}
                    {clueMode === 'modal' && clueQueue.length > 0 && activeModal === null && (
                        <div className="absolute inset-0 z-[60] panel flex flex-col items-center justify-center p-6 text-center">
                            <div className="bg-black/90 border-2 border-emerald-500 rounded-2xl p-5 max-w-md w-full shadow-[0_0_30px_#10b981]">
                                <div className="flex justify-between items-center mb-4 border-b border-emerald-900 pb-2">
                                    <span className="text-emerald-400 font-black text-xs sm:text-sm uppercase tracking-widest">🔬 Evidence Link Confirmed</span>

                                        </div>
                                    )}

                                    <div className="mono text-[11px] text-gray-400 mb-1 break-words">Supporting PMIDs: {(H.cited_pmids || []).map((id, i) => <span key={id}>{i > 0 ? ', ' : ''}<a className="text-sky-300 underline" href={pm(id)} target="_blank" rel="noopener noreferrer">{id}</a></span>)}</div>
                                    <div className="text-[11px] text-gray-500 mb-3 italic">A hypothesis for exploration, not a proven result or medical advice.</div>

                                    <div className="flex flex-col gap-2">
                                        <a href={googleSearchUrl} target="_blank" rel="noopener noreferrer" className="block text-center text-xs font-black text-white bg-blue-600 hover:bg-blue-500 py-3 rounded-lg border border-blue-400 shadow-md active:scale-95">Dig Deeper with Google</a>
                                        <a href={chatGptUrl} target="_blank" rel="noopener noreferrer" className="block text-center text-xs font-black text-white bg-emerald-700 hover:bg-emerald-600 py-3 rounded-lg border border-emerald-400 shadow-md active:scale-95">Dig Deeper with ChatGPT</a>
                                    </div>
                                </div>

                                <button onClick={nextLevel} className="w-full py-4 rounded-2xl bg-gradient-to-b from-amber-400 to-amber-600 text-black font-black text-xl uppercase tracking-widest shadow-[0_0_30px_#f59e0b] border-2 border-amber-200 border-b-[6px] active:scale-95">Next Hypothesis ➔</button>
                            </div>
                        </div>
                        );
                    })()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    
    
    </script>
</body>
</html>
